[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[rpc_endpoints]
amoy = "${POLYGON_AMOY_RPC}"
polygon = "${POLYGON_RPC}"

[etherscan]
amoy = { key = "${ETHERSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }

# Linter — só mostra avisos críticos (high/medium)
[lint]
severity = ["high", "medium"]

# Fuzz testing
[fuzz]
runs = 256

# Formatter
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
